name: Build DemocracyBot

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11' # Dbot uses java 11

      # Weeve activities
      - name: Build weeve
        run: |
          echo I AM HERE
          git clone https://github.com/FreshSupaSulley/weeve.git
          echo I AM HERE2
          ./weeve/gradlew build
          echo I AM HERE3
          mkdir -p libs
          echo I AM HER4
          cp weeve/build/libs/weeve.jar libs/weeve.jar

      - name: Create gradle.properties for tokens
        run: |
          # Weeve (yall can know my discord acc thats cool)
          echo "token=${{ secrets.WEEVE }}" >> gradle.properties
          echo "test_token=${{ secrets.OBAMA_BOT }}" >> gradle.properties
          echo "owner_id=276886864525262849" >> gradle.properties
          echo "notify_errors=true" >> gradle.properties
          # Dbot
          echo "democracy=${{ secrets.DEMOCRACY }}" >> gradle.properties
          echo "github_access_token=${{ secrets.GHAC }}" >> gradle.properties

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build

        # I hope no one can see this
      - name: Upload JAR as private artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemocracyBot
          path: build/libs/*.jar
    
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this one is built-in
